<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Katie's Vinyl Collection</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f5;
    color: #18181b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
}
.login-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
    width: 100%;
    max-width: 400px;
    padding: 32px;
}
.icon-header {
    font-size: 2.2rem;
    margin-bottom: 12px;
}
h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 8px;
}
p.subtitle {
    color: #71717a;
    font-size: 0.9rem;
    margin-bottom: 24px;
}
.form-group {
    margin-bottom: 20px;
}
label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #3f3f46;
}
input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #e4e4e7;
    background: #fafafa;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.15s ease;
}
input[type="password"]:focus {
    border-color: #18181b;
    background: white;
}
button {
    width: 100%;
    padding: 12px;
    background: #18181b;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
}
button:hover {
    opacity: 0.9;
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.error-msg {
    color: #ef4444;
    font-size: 0.85rem;
    margin-top: 12px;
    display: none;
    text-align: center;
}
.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-size: 0.85rem;
    color: #71717a;
    text-decoration: none;
}
.back-link:hover {
    color: #18181b;
}
</style>
</head>
<body>

<div class="login-card">
    <div class="icon-header">🔐</div>
    <h1>Admin Studio</h1>
    <p class="subtitle">Enter password to upload vinyls, run AI recommendations, and manage collection.</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="password">Admin Password</label>
            <input type="password" id="password" placeholder="••••••••" required autofocus>
        </div>
        <button type="submit" id="submitBtn">Log In</button>
        <div class="error-msg" id="errorMsg">Incorrect password</div>
    </form>

    <a href="/" class="back-link">← Back to Public Gallery</a>
</div>

<script>
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Verifying...';
    err.style.display = 'none';

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: password })
        });

        if (res.ok) {
            window.location.href = '/admin';
        } else {
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Log In';
        }
    } catch (error) {
        err.textContent = 'Connection error, please try again.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log In';
    }
}
</script>

</body>
</html>
