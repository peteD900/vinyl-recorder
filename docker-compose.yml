version: "3.8"

services:
  vinyl-web:
    build: .
    container_name: vinyl-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
      - jellyfin_default

  vinyl-bot:
    build: .
    container_name: vinyl-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: python -m vinyl_recorder.telegram_bot
    depends_on:
      - vinyl-web
    networks:
      - default
      - jellyfin_default

networks:
  default:
  jellyfin_default:
    external: true