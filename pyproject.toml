[project]
name = "vinyl-recorder"
version = "0.1.0"
description = "Keep track of vinyl collection and update data using telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "pillow>=12.0.0",
    "pyprojroot>=0.3.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.5",
    "requests>=2.32.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# One-shot: needed only for scripts/migrate_sheets_to_sqlite.py.
# Install with: pip install -e '.[migration]'  — remove once migration done.
migration = [
    "gspread>=6.2.1",
    "google-auth>=2.45.0",
]

[tool.setuptools]
packages = ["vinyl_recorder"]
